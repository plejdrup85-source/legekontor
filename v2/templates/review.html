<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produktgjennomgang</title>
  <style>
    :root { --ink:#17211b; --muted:#667068; --paper:#f5f3ed; --card:#fff; --line:#d8d9d2; --green:#185f43; --green-soft:#e8f2ec; --amber:#8a5a00; --amber-soft:#fff4d6; --red:#9b2d27; --red-soft:#fbe9e7; --blue:#245b8a; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { border:1px solid transparent; border-radius:7px; padding:8px 12px; cursor:pointer; background:var(--green); color:#fff; }
    button:hover:not(:disabled) { filter:brightness(.94); }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
    button:disabled { opacity:.48; cursor:not-allowed; }
    button.secondary { background:#fff; color:var(--ink); border-color:var(--line); }
    button.danger { background:var(--red); }
    button.quiet { background:transparent; color:var(--blue); padding:4px; }
    a { color:var(--blue); }
    .shell { max-width:1440px; margin:auto; padding:20px; }
    .topbar,.row,.actions,.statuses { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .topbar { justify-content:space-between; margin-bottom:16px; }
    .topbar h1 { margin:2px 0; font:650 23px/1.2 ui-serif,Georgia,serif; }
    .progress { min-width:260px; }
    progress { width:100%; accent-color:var(--green); }
    .notice { margin-bottom:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .notice.warning { background:var(--amber-soft); border-color:#e1c77c; }
    .notice.error { background:var(--red-soft); color:var(--red); border-color:#e3aaa5; }
    .hidden { display:none !important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .workspace { display:grid; grid-template-columns:minmax(250px,330px) 1fr; min-height:620px; border:1px solid var(--line); background:var(--card); border-radius:12px; overflow:hidden; }
    .queue { border-right:1px solid var(--line); background:#faf9f5; display:flex; flex-direction:column; min-width:0; }
    .queue-tools { padding:14px; border-bottom:1px solid var(--line); }
    .queue-tools-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .queue-tools select { width:100%; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:7px; background:#fff; }
    .queue-list { list-style:none; padding:0; margin:0; overflow:auto; flex:1; }
    .queue-item { display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; padding:11px 13px; border-bottom:1px solid #e8e7e1; }
    .queue-item:hover,.queue-item.active { background:#edf3ef; }
    .queue-item.active { box-shadow:inset 3px 0 var(--green); }
    .queue-open { appearance:none; border:0; background:transparent; color:inherit; padding:0; text-align:left; width:100%; min-width:0; cursor:pointer; font:inherit; }
    .queue-title { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
    .queue-meta-row { display:flex; align-items:baseline; gap:2px 8px; flex-wrap:wrap; margin-top:2px; }
    .queue-meta { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:12px; }
    .queue-status { flex:none; color:var(--muted); font-size:12px; white-space:nowrap; }
    .queue-status.pending { color:var(--amber); }
    .queue-status.approved { color:var(--green); }
    .queue-status.not_same,.queue-status.no_suitable { color:var(--red); }
    .queue-status.deleted { color:var(--muted); }
    .pill { border-radius:999px; padding:2px 7px; font-size:12px; white-space:nowrap; background:#eee; color:#4e5750; }
    .pill.approved { color:var(--green); background:var(--green-soft); }
    .pill.not_same,.pill.no_suitable { color:var(--red); background:var(--red-soft); }
    .pill.pending { color:var(--amber); background:var(--amber-soft); }
    .detail { padding:22px; overflow:auto; min-width:0; }
    .detail-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:16px; }
    .detail h2 { margin:3px 0 6px; font:650 25px/1.25 ui-serif,Georgia,serif; }
    .muted { color:var(--muted); }
    .section { margin-top:20px; }
    .section h3 { margin:0 0 9px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
    .facts { display:grid; grid-template-columns:repeat(4,minmax(110px,1fr)); gap:10px; }
    .comparison { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .product-panel { border:1px solid var(--line); border-radius:9px; padding:14px; background:#faf9f5; }
    .product-panel.onemed { background:var(--green-soft); border-color:#b8d2c2; }
    .product-panel h3 { color:var(--ink); font-size:16px; letter-spacing:0; text-transform:none; }
    .product-panel dl { display:grid; grid-template-columns:110px 1fr; gap:6px 10px; margin:10px 0 0; }
    .product-panel dt { color:var(--muted); }
    .product-panel dd { margin:0; font-weight:600; overflow-wrap:anywhere; }
    .source-excerpt { white-space:pre-wrap; overflow-wrap:anywhere; margin:8px 0 0; padding:10px; border-radius:7px; background:#fff; border:1px solid #e1c77c; }
    .fact { background:#f8f7f2; padding:10px; border-radius:7px; }
    .fact span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; }
    .candidate { display:grid; grid-template-columns:24px minmax(160px,1fr) minmax(90px,.4fr) auto; align-items:center; gap:10px; padding:11px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; }
    .candidate.active { border-color:var(--green); background:var(--green-soft); }
    .candidate.invalid { border-color:#e3aaa5; background:var(--red-soft); }
    .candidate strong,.candidate small { display:block; }
    .master-error { color:var(--red); font-weight:600; }
    .search-results { border:1px solid var(--line); border-radius:8px; margin-top:6px; max-height:220px; overflow:auto; }
    .catalog-search { width:100%; }
    .search-result { display:flex; justify-content:space-between; width:100%; text-align:left; color:var(--ink); background:#fff; border:0; border-bottom:1px solid var(--line); border-radius:0; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; color:var(--muted); font-size:12px; }
    input,textarea,select { border:1px solid var(--line); border-radius:7px; padding:8px; background:#fff; color:var(--ink); }
    label input,label textarea { width:100%; margin-top:4px; color:var(--ink); }
    textarea { min-height:70px; resize:vertical; }
    .decision-bar { position:sticky; bottom:-22px; margin:22px -22px -22px; padding:14px 22px; background:#fff; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .bulk { padding:12px 14px; border-top:1px solid var(--line); background:#f1f0ea; }
    .empty { text-align:center; padding:70px 20px; color:var(--muted); }
    .toast { position:fixed; right:20px; bottom:20px; padding:12px 14px; color:#fff; background:#243329; border-radius:8px; box-shadow:0 10px 30px #0003; }
    .toast button.quiet { color:#fff; text-decoration:underline; text-underline-offset:3px; }
    .toast button:focus-visible { outline-color:#fff; }
    dialog { width:min(520px,calc(100% - 30px)); border:1px solid var(--line); border-radius:10px; padding:20px; }
    dialog::backdrop { background:#0005; }
    @media (max-width:800px) { .workspace { grid-template-columns:1fr; } .queue { max-height:300px; border-right:0; border-bottom:1px solid var(--line); } .facts,.field-grid,.comparison { grid-template-columns:1fr; } .candidate { grid-template-columns:24px minmax(0,1fr); align-items:start; } .candidate > :nth-child(3),.candidate > :nth-child(4) { grid-column:2; } .detail { padding:15px; } .decision-bar { margin:18px -15px -15px; bottom:-15px; } }
  </style>
</head>
<body>
<!-- impeccable:direction-contract seed=b96f7840
THESIS: Én rolig, tydelig produktbeslutning om gangen for en selger med mange linjer.
OWN-WORLD: Papirhvit arbeidsflate, dempet grønn og rød; norsk tekst bærer alltid status sammen med farge.
STORY: Arbeidskø leder til sammenligning, kandidatvalg, beslutning, automatisk neste linje og Angre.
FIRST VIEWPORT: Fremdrift, kø, aktiv linje og konkurrent mot OneMed er synlig uten unødvendige introduksjoner.
FORM: Kompakt systemtekst, serif-titler, klare paneler og serverautoritative handlinger med tastaturstøtte.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<main class="shell">
  <header class="topbar">
    <div><a href="/v2/">← Til jobber</a><h1>Produktgjennomgang</h1></div>
    <div class="progress"><div id="progressText" class="muted">Laster …</div><progress id="progress" max="1" value="0"></progress></div>
  </header>
  <div id="error" class="notice error hidden" role="alert"></div>
  <div id="lockNotice" class="notice warning hidden"><span id="lockText">Jobben er låst.</span> <button id="unlockButton" class="secondary" data-mutation disabled>Lås opp</button></div>
  <section class="workspace" aria-label="Gjennomgang av produktlinjer" aria-busy="true">
    <aside class="queue">
      <div class="queue-tools"><div class="queue-tools-head"><strong>Arbeidskø</strong><span id="queueCount" class="queue-meta">0 linjer</span></div><label for="statusFilter" class="sr-only">Filtrer etter beslutning</label><select id="statusFilter"><option value="">Alle linjer</option><option value="pending">Ikke vurdert</option><option value="done">Ferdige</option></select></div>
      <ul id="queueList" class="queue-list"></ul>
      <div id="bulkBar" class="bulk hidden"><div><strong id="selectedCount">0 valgt</strong></div><div class="actions"><button data-bulk="approved" data-mutation disabled>Godkjenn valgte</button><button class="secondary" data-bulk="not_same" data-mutation disabled>Ikke samme</button><button class="secondary" data-bulk="no_suitable" data-mutation disabled>Ingen passende vare funnet</button></div></div>
    </aside>
    <article id="detail" class="detail"><div class="empty">Velg en linje i køen.</div></article>
  </section>
  <div class="actions" style="margin-top:14px"><button id="addRowButton" class="secondary" data-mutation disabled>Legg til linje</button><a id="xlsxExport" href="#">Eksporter Excel</a><a id="pdfExport" href="#">Eksporter PDF</a><button id="commitButton" class="secondary hidden" data-mutation disabled>Oppdater prisdatabase</button><button id="lockButton" class="secondary" data-mutation disabled>Lås jobb</button></div>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"><span id="toastText"></span> <button id="undoButton" class="quiet" aria-keyshortcuts="Alt+Z" data-mutation>Angre (Alt+Z)</button> <button id="dismissToast" class="quiet" aria-label="Lukk melding">Lukk</button></div>
<dialog id="addDialog"><form id="addForm" method="dialog"><h2>Legg til linje</h2><div class="field-grid"><label>Beskrivelse<input name="description" required></label><label>Pris<input name="price" type="number" step="any" required></label><label>Antall<input name="quantity" type="number" step="any" value="1"></label><label>Leverandør<input name="competitor_name"></label><label>Leverandørens varenr.<input name="competitor_artnr"></label><label>Spesifikasjon<input name="specification"></label></div><div class="actions" style="margin-top:16px"><button type="submit" data-mutation disabled>Legg til</button><button type="button" id="cancelAdd" class="secondary">Avbryt</button></div></form></dialog>
<script>
(() => {
  "use strict";
  const pathParts = location.pathname.split("/").filter(Boolean);
  const jobId = decodeURIComponent(pathParts[pathParts.length - 2]);
  const state = { rows:[], activeId:null, checked:new Set(), locked:false, canCommit:false, lastDecision:null, searchTimer:null, revision:0, mutationInFlight:false,busy:true,syncFailed:false };
  const $ = id => document.getElementById(id);
  const decisionText = { pending:"Ikke vurdert", approved:"Godkjent match", not_same:"Ikke samme produkt", no_suitable:"Ingen passende vare funnet" };
  const endpoint = suffix => `/v2/review/${encodeURIComponent(jobId)}${suffix}`;
  function node(tag, props={}, children=[]) { const el=document.createElement(tag); for (const [key,value] of Object.entries(props)) { if (key==="className") el.className=value; else if (key==="text") el.textContent=value ?? ""; else if (key==="checked") el.checked=Boolean(value); else if (key==="disabled") el.disabled=Boolean(value); else el.setAttribute(key,String(value)); } for (const child of children) el.append(child); return el; }
  function money(value) { return value==null || value==="" ? "–" : new Intl.NumberFormat("nb-NO",{style:"currency",currency:"NOK"}).format(Number(value)); }
  function showError(message) { $("error").textContent=message; $("error").classList.remove("hidden"); }
  function showSyncError(message) { showError(`${message?`${message} `:""}Gjennomgangen er ikke synkronisert. Last inn siden på nytt før du fortsetter.`); }
  function clearError() { if(state.syncFailed)return;$("error").classList.add("hidden"); }
  function setBusy(busy) { state.busy=busy;const effectiveBusy=busy||state.syncFailed;document.querySelector(".workspace").setAttribute("aria-busy",String(effectiveBusy)); if(effectiveBusy){document.querySelectorAll("[data-mutation]").forEach(control=>{control.disabled=true;});}else{render();} }
  async function api(url, options={}) { clearError(); const headers={"Content-Type":"application/json",...(options.headers||{})}; if(options.method&&options.method!=="GET"&&url.startsWith(endpoint("")))headers["If-Match"]=String(state.revision); const response=await fetch(url,{...options,headers}); let body={}; try { body=await response.json(); } catch (_) {} if (!response.ok) { if (response.status===423||response.status===409) await load(false); throw new Error(body.error || `Forespørselen feilet (${response.status})`); } return body; }
  async function mutate(url,options={},reload=true) { if(state.mutationInFlight)throw new Error("En annen handling pågår. Vent til den er ferdig."); if(state.busy||state.syncFailed)throw new Error("Gjennomgangen er ikke synkronisert."); state.mutationInFlight=true;setBusy(true);try{const result=await api(url,options);if(reload)await load(false,true);return result;}finally{state.mutationInFlight=false;setBusy(false);} }
  function candidateIdentity(candidate) { return candidate?{candidate_idx:candidate.candidate_idx,our_artnr:String(candidate.our_artnr||""),matched_from:String(candidate.matched_from||candidate.source||"")}:null; }
  function activeRow() { return state.rows.find(row => row.dedup_idx===state.activeId); }
  function candidateFor(row) { const idx=row.selected_candidate_idx ?? row.suggested_candidate_idx ?? row.best_candidate_idx; return (row.candidates||[]).find(c => c.candidate_idx===idx); }
  function visibleRows() { const status=$("statusFilter").value; return state.rows.filter(row => !status || (status==="pending" ? !row.deleted&&row.review_status==="pending" : status==="done" ? row.deleted||row.review_status!=="pending" : false)); }
  function renderQueue() { const list=$("queueList"); const shown=visibleRows(); const total=state.rows.length; $("queueCount").textContent=shown.length===total?`${total} ${total===1?"linje":"linjer"}`:`${shown.length} av ${total} linjer`; list.replaceChildren(); for (const row of shown) { const check=node("input",{type:"checkbox",checked:state.checked.has(row.dedup_idx),disabled:row.deleted,"aria-label":`Velg ${row.description||"linje"}`}); check.addEventListener("change",()=>{ check.checked ? state.checked.add(row.dedup_idx) : state.checked.delete(row.dedup_idx); renderBulk(); }); const statusText=row.deleted?"Fjernet":decisionText[row.review_status]||"Ikke vurdert"; const statusClass=row.deleted?"deleted":row.review_status; const meta=node("span",{className:"queue-meta-row"},[node("span",{className:"queue-meta",text:`${row.competitor||"Ukjent leverandør"} · ${money(row.competitor_line_amount)}`}),node("span",{className:`queue-status ${statusClass}`,text:statusText})]); const active=row.dedup_idx===state.activeId; const open=node("button",{type:"button",className:"queue-open","aria-current":active?"true":"false","aria-label":`Åpne ${row.description||"linje"}. Status: ${statusText}`},[node("span",{className:"queue-title",text:row.description||"Uten beskrivelse"}),meta]); open.addEventListener("click",()=>{ state.activeId=row.dedup_idx; render(); }); const item=node("li",{className:`queue-item${active?" active":""}`},[check,open]); list.append(item); } if (!list.childElementCount) list.append(node("li",{className:"empty",text:"Ingen linjer i dette filteret."})); }
  function renderBulk() { $("bulkBar").classList.toggle("hidden",state.checked.size===0); $("selectedCount").textContent=`${state.checked.size} valgt`; }
  function fact(label,value) { return node("div",{className:"fact"},[node("span",{text:label}),node("strong",{text:value??"–"})]); }
  function candidateCard(row,candidate) { const selected=row.selected_candidate_idx===candidate.candidate_idx; const suggested=row.selected_candidate_idx==null && (row.suggested_candidate_idx??row.best_candidate_idx)===candidate.candidate_idx; const radio=node("input",{type:"radio",name:`candidate-${row.dedup_idx}`,checked:selected,disabled:state.busy||state.syncFailed||state.locked||row.deleted||!candidate.eligible,"data-mutation":"","aria-label":`Velg ${candidate.our_description||candidate.our_artnr||"kandidat"}`}); radio.addEventListener("change",()=>selectCandidate(row,candidate)); const copy=[node("strong",{text:candidate.our_description||"Uten produktnavn"}),node("small",{text:`Varenr. ${candidate.our_artnr||"–"} · ${candidate.match_quality||"Ukjent treff"}`})]; if(!candidate.eligible) copy.push(node("small",{className:"master-error",text:candidate.masterdata_error||"Masterdatafeil"})); return node("div",{className:`candidate${selected||suggested?" active":""}${!candidate.eligible?" invalid":""}`},[radio,node("div",{},copy),node("div",{},[node("small",{text:`ALC per enhet ${candidate.alc??"–"}`}),node("small",{text:candidate.item_status||"Status mangler"})]),node("strong",{text:money(candidate.our_unit_price)})]); }
  function detailPair(label, value) { return [node("dt",{text:label}),node("dd",{text:value??"–"})]; }
  function productPanel(title, values, onemed=false) {
    const details=node("dl");
    for(const [label,value] of values) details.append(...detailPair(label,value));
    return node("div",{className:`product-panel${onemed?" onemed":""}`},[node("h3",{text:title}),details]);
  }
  function renderDetail() {
    const host=$("detail");
    host.replaceChildren();
    const row=activeRow();
    if(!row){host.append(node("div",{className:"empty",text:"Velg en linje i køen."}));return;}
    const candidate=candidateFor(row);
    const candidateState=row.candidate_status==="selected"?"Valgt OneMed-produkt":"Foreslått OneMed-produkt";
    const header=node("div",{className:"detail-head"},[
      node("div",{},[
        node("h2",{text:row.description||"Uten beskrivelse",tabindex:"-1"}),
        node("div",{className:"muted",text:`Kandidat: ${row.candidate_status==="selected"?"Valgt":"Foreslått"} · Beslutning: ${decisionText[row.review_status]||"Ikke vurdert"} · Linje ${row.dedup_idx}`})
      ]),
      node("span",{className:`pill ${row.review_status}`,text:decisionText[row.review_status]||"Ikke vurdert"})
    ]);
    host.append(header);
    if(row.merge_warning) host.append(node("div",{className:"notice warning",text:"Kritisk avvik: sammenslåtte linjer må kontrolleres før godkjenning."}));
    const confidence=Number(row.confidence);
    if(Number.isFinite(confidence)&&confidence<0.7){
      const warning=node("div",{className:"notice warning"},[
        node("strong",{text:`Lav dokumentsikkerhet (${Math.round(confidence*100)} %)`}),
        node("p",{text:"Kontroller informasjonen mot originalutdraget før du beslutter."})
      ]);
      if(row.raw_text) warning.append(node("pre",{className:"source-excerpt",text:row.raw_text}));
      host.append(warning);
    }
    host.append(node("section",{className:"section"},[
      node("h3",{text:"Sammenligning"}),
      node("div",{className:"comparison"},[
        productPanel("Konkurrentens produkt",[
          ["Navn",row.description||"–"],["Varenummer",row.competitor_artnr||"–"],["Leverandør",row.competitor||"–"],["Spesifikasjon",row.specification||"–"],["Pris",money(row.competitor_unit_price)],["Linjesum",money(row.competitor_line_amount)]
        ]),
        productPanel(candidateState,[
          ["Navn",candidate?.our_description||"Ingen OneMed-match valgt"],["Varenummer",candidate?.our_artnr||"–"],["Produsent",candidate?.our_producer||"–"],["Spesifikasjon",candidate?.our_specification||"–"],["Pris",money(candidate?.our_unit_price)],["ALC per enhet",candidate?.alc??"–"]
        ],true)
      ])
    ]));
    const candidates=node("fieldset"); candidates.append(node("legend",{className:"sr-only",text:"Velg OneMed-kandidat"}));
    const candidateCount=(row.candidates||[]).length;
    for(const c of row.candidates||[]) candidates.append(candidateCard(row,c));
    if(candidateCount===0)candidates.append(node("div",{className:"muted",text:"Ingen automatiske kandidater."}));
    const search=node("input",{type:"search",className:"catalog-search",placeholder:"Søk etter varenavn eller varenummer","aria-label":"Søk i OneMed-katalogen"});
    const results=node("div",{className:"search-results hidden"});
    search.addEventListener("input",()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>catalogSearch(row,search.value,results),250);});
    host.append(node("section",{className:"section"},[node("h3",{text:"Finn et annet OneMed-produkt"}),candidates,search,results]));
    const qty=node("input",{type:"number",step:"any",value:row.quantity_override??row.total_units??0,disabled:state.busy||state.syncFailed||state.locked,"data-mutation":""});
    const comment=node("textarea",{disabled:state.busy||state.syncFailed||state.locked,"data-mutation":""});
    comment.value=row.comment||"";
    qty.addEventListener("change",()=>saveExtras(row,{quantity_override:Number(qty.value)}));
    comment.addEventListener("change",()=>saveExtras(row,{comment:comment.value}));
    host.append(node("section",{className:"section"},[node("h3",{text:"Detaljer"}),node("div",{className:"field-grid"},[node("label",{text:"OneMed-antall"},[qty]),node("label",{text:"Kommentar"},[comment])])]));
    const decisions=node("div",{className:"statuses"});
    [["approved","Godkjenn"],["not_same","Ikke samme produkt"],["no_suitable","Ingen passende vare funnet"]].forEach(([status,label])=>{
      const button=node("button",{className:status==="approved"?"":"secondary",disabled:state.busy||state.syncFailed||state.locked||row.deleted,"data-mutation":"",text:label});
      button.addEventListener("click",()=>decide(row,status));
      decisions.append(button);
    });
    const del=node("button",{className:"quiet",disabled:state.busy||state.syncFailed||state.locked,"data-mutation":"",text:row.deleted?"Gjenopprett linje":"Slett linje"});
    del.addEventListener("click",()=>toggleDelete(row));
    const next=node("button",{className:"secondary",text:"Neste →"});
    next.addEventListener("click",nextRow);
    host.append(node("div",{className:"decision-bar"},[decisions,node("div",{className:"actions"},[del,next])]));
  }
  function renderProgress() { const total=state.rows.filter(r=>!r.deleted).length; const done=state.rows.filter(r=>!r.deleted&&r.review_status!=="pending").length; $("progress").max=Math.max(total,1); $("progress").value=done; $("progressText").textContent=`${done} av ${total} vurdert`; }
  function render() { const blocked=state.busy||state.syncFailed;renderQueue(); renderBulk(); renderDetail(); renderProgress(); $("lockNotice").classList.toggle("hidden",!state.locked); $("lockButton").classList.toggle("hidden",state.locked); $("addRowButton").disabled=blocked||state.locked; $("commitButton").disabled=blocked||state.locked; $("lockButton").disabled=blocked; $("unlockButton").disabled=blocked; document.querySelectorAll("[data-bulk]").forEach(button=>{button.disabled=blocked||state.locked;}); $("addForm").querySelector('[type="submit"]').disabled=blocked; $("undoButton").disabled=blocked||!state.lastDecision; }
  function nextRow() { const rows=visibleRows(); const pos=rows.findIndex(r=>r.dedup_idx===state.activeId); const next=rows.slice(pos+1).find(r=>r.review_status==="pending"&&!r.deleted)||rows.find(r=>r.review_status==="pending"&&!r.deleted); if(next){state.activeId=next.dedup_idx;render(); requestAnimationFrame(()=>$("detail").querySelector("h2")?.focus());} }
  async function load(manageBusy=true,rethrow=false) { if(manageBusy)setBusy(true);try { const data=await api(endpoint("")); state.rows=data.rows||[]; state.revision=data.revision??0; state.locked=Boolean(data.lock?.locked); state.canCommit=Boolean(data.can_commit_pricedb);state.syncFailed=false;clearError(); $("commitButton").classList.toggle("hidden",!state.canCommit); $("lockText").textContent=data.lock?.locked_by?`Jobben er låst av ${data.lock.locked_by}.`:"Jobben er låst."; if(state.activeId==null||!state.rows.some(r=>r.dedup_idx===state.activeId)) state.activeId=(state.rows.find(r=>r.review_status==="pending"&&!r.deleted)||state.rows[0]||{}).dedup_idx??null; if(!manageBusy)render(); } catch(error){state.syncFailed=true;showSyncError(error.message);if(rethrow)throw error;} finally{if(manageBusy)setBusy(false);} }
  async function selectCandidate(row,candidate) { try { await mutate(endpoint("/select"),{method:"POST",body:JSON.stringify({dedup_idx:row.dedup_idx,candidate_idx:candidate.candidate_idx})}); } catch(error){showError(error.message);} }
  async function decide(row,status) { try { let acknowledge_critical=false; if(status==="approved"&&row.merge_warning){acknowledge_critical=confirm("Raden har et kritisk avvik. Har du kontrollert sammenslåingen?");if(!acknowledge_critical)return;} const result=await mutate(endpoint("/decide"),{method:"POST",body:JSON.stringify({dedup_idx:row.dedup_idx,status,acknowledge_critical,revision:state.revision,candidate_identity:candidateIdentity(candidateFor(row))})}); state.lastDecision={undo_token:result.undo_token}; $("undoButton").classList.remove("hidden"); showToast(`${decisionText[status]} lagret.`); nextRow(); } catch(error){showError(error.message);} }
  async function bulkDecide(status) { try { const ids=[...state.checked]; await mutate(endpoint("/bulk-decide"),{method:"POST",body:JSON.stringify({dedup_indices:ids,status})}); state.checked.clear(); state.lastDecision=null; showToast(`${ids.length} linjer oppdatert.`); $("undoButton").classList.add("hidden"); render(); } catch(error){showError(error.message);} }
  async function catalogSearch(row,query,host) { if(state.syncFailed){showSyncError();return;}if(query.trim().length<2){host.classList.add("hidden");host.replaceChildren();return;} try { const data=await api(endpoint("/search-catalog"),{method:"POST",body:JSON.stringify({query,limit:12})});host.replaceChildren();for(const result of data.results||[]){const b=node("button",{type:"button",className:"search-result",disabled:state.busy||state.syncFailed||state.locked,"data-mutation":""},[node("span",{text:`${result.our_artnr} · ${result.our_description}`}),node("span",{text:money(result.our_unit_price)})]);b.addEventListener("click",()=>replaceCandidate(row,result.our_artnr,result.matched_from));host.append(b);}if(!host.childElementCount)host.append(node("div",{className:"empty",text:"Ingen salgbare produkter funnet."}));host.classList.remove("hidden");}catch(error){if(state.syncFailed)showSyncError();else showError(error.message);} }
  async function replaceCandidate(row,artnr,matchedFrom) { try { await mutate(endpoint("/replace-candidate"),{method:"POST",body:JSON.stringify({dedup_idx:row.dedup_idx,our_artnr:artnr,matched_from:matchedFrom})});}catch(error){showError(error.message);} }
  async function saveExtras(row,values) { try { await mutate(endpoint("/extras"),{method:"POST",body:JSON.stringify({dedup_idx:row.dedup_idx,...values})});}catch(error){showError(error.message);} }
  async function toggleDelete(row) { try { await mutate(endpoint(row.deleted?"/restore":"/delete"),{method:"POST",body:JSON.stringify({dedup_idx:row.dedup_idx})});}catch(error){showError(error.message);} }
  function showToast(text) { $("toastText").textContent=text;$("toast").classList.remove("hidden");$("undoButton").classList.toggle("hidden",!state.lastDecision); }
  $("undoButton").addEventListener("click",async()=>{if(!state.lastDecision||state.busy||state.syncFailed)return;const undo=state.lastDecision;try{await mutate(endpoint("/undo"),{method:"POST",body:JSON.stringify(undo)});state.lastDecision=null;$("toast").classList.add("hidden");}catch(error){showError(error.message);}});
  $("dismissToast").addEventListener("click",()=>{state.lastDecision=null;$("toast").classList.add("hidden");render();});
  $("statusFilter").addEventListener("change",renderQueue);
  document.querySelectorAll("[data-bulk]").forEach(button=>button.addEventListener("click",()=>bulkDecide(button.dataset.bulk)));
  $("xlsxExport").href=`/v2/export/${encodeURIComponent(jobId)}?format=xlsx`; $("pdfExport").href=`/v2/export/${encodeURIComponent(jobId)}?format=pdf`;
  $("lockButton").addEventListener("click",async()=>{try{await mutate(endpoint("/lock"),{method:"POST",body:"{}"});}catch(error){showError(error.message);}}); $("unlockButton").addEventListener("click",async()=>{try{await mutate(endpoint("/unlock"),{method:"POST",body:"{}"});}catch(error){showError(error.message);}});
  $("commitButton").addEventListener("click",async()=>{if(!confirm("Oppdater prisdatabasen med godkjente linjer?"))return;try{const data=await mutate(`/v2/pricedb/commit/${encodeURIComponent(jobId)}`,{method:"POST",body:"{}"},false);showToast(`${data.committed??0} priser oppdatert.`);}catch(error){showError(error.message);}});
  $("addRowButton").addEventListener("click",()=>$("addDialog").showModal()); $("cancelAdd").addEventListener("click",()=>$("addDialog").close()); $("addForm").addEventListener("submit",async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget));values.price=Number(values.price);values.quantity=Number(values.quantity);try{const data=await mutate(endpoint("/add-row"),{method:"POST",body:JSON.stringify(values)});$("addDialog").close();event.currentTarget.reset();state.activeId=data.row.dedup_idx;render();}catch(error){showError(error.message);}});
  document.addEventListener("keydown",event=>{if(event.altKey&&event.key.toLocaleLowerCase()==="z"&&state.lastDecision&&!state.busy&&!state.syncFailed){event.preventDefault();$("undoButton").click();return;}if(event.target.closest("input,textarea,select,button"))return;if(event.altKey&&event.key==="ArrowDown"){event.preventDefault();nextRow();}if(event.altKey&&event.key==="ArrowUp"){event.preventDefault();const rows=visibleRows();const pos=rows.findIndex(r=>r.dedup_idx===state.activeId);if(pos>0){state.activeId=rows[pos-1].dedup_idx;render();$("detail").querySelector("h2")?.focus();}}});
  load();
})();
</script>
</body>
</html>
