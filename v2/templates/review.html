<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>V2 Review</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px 24px; color: #1a1a1a; background: #f8f9fa; }
    a { color: #1F4E79; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { background: #1F4E79; color: white; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #6b7280; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }
    button.sm { padding: 4px 8px; font-size: 12px; }
    button.warn-btn { background: #f59e0b; color: #1a1a1a; }
    select, input[type=text], input[type=number], textarea { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; font-family: inherit; }
    .muted { color: #666; font-size: 13px; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .header h2 { margin: 0; }
    .summary { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
    .summary .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-deleted { background: #f3f4f6; color: #6b7280; }
    .badge-warn { background: #fff7ed; color: #c2410c; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; }
    .toolbar input[type=text] { width: 220px; }
    .toolbar select { min-width: 120px; }
    .lock-bar { padding: 8px 14px; background: #fef3c7; border: 1px solid #fbbf24; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .card.approved { border-left: 4px solid #16a34a; }
    .card.rejected { border-left: 4px solid #dc2626; }
    .card.pending { border-left: 4px solid #f59e0b; }
    .card.deleted-card { border-left: 4px solid #9ca3af; opacity: 0.55; }
    .card.warn { background: #fffbeb; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .card-title { font-weight: 600; font-size: 14px; }
    .card-meta { font-size: 12px; color: #6b7280; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 16px; font-size: 13px; margin-bottom: 8px; }
    .card-grid dt { color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-grid dd { margin: 0 0 4px 0; font-weight: 500; }
    .candidates { margin-top: 8px; }
    .cand-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    .cand-row:hover { background: #f3f4f6; }
    .cand-row.selected { background: #eff6ff; border: 1px solid #3b82f6; }
    .cand-row.disabled { cursor: default; opacity: 0.7; }
    .cand-row.disabled:hover { background: transparent; }
    .cand-row .artnr { font-weight: 600; min-width: 70px; }
    .cand-row .artnr a { color: #1F4E79; }
    .cand-row .link-icon { font-size: 11px; min-width: 16px; }
    .cand-row .link-icon a { color: #6b7280; }
    .cand-row .link-icon a:hover { color: #1F4E79; }
    .cand-row .name { flex: 1; color: #374151; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cand-row .spec { flex: 0.6; color: #6b7280; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cand-row .price { min-width: 90px; text-align: right; }
    .cand-row .score { min-width: 60px; text-align: right; color: #6b7280; }
    .cand-row .desc { flex: 1; color: #374151; }
    .savings-pos { color: #16a34a; font-weight: 600; }
    .savings-neg { color: #dc2626; font-weight: 600; }
    .extras { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; }
    .extras textarea { flex: 1; min-height: 32px; resize: vertical; }
    .decision-btns { display: flex; gap: 4px; }
    .pager { display: flex; justify-content: center; gap: 8px; margin: 16px 0; align-items: center; }
    .merged-info { font-size: 11px; color: #9333ea; margin-left: 8px; }
    .warn-box { font-size: 11px; color: #c2410c; background: #fff7ed; padding: 4px 8px; border-radius: 4px; margin-top: 4px; }
    .no-match { color: #9ca3af; font-style: italic; }
    .qty-input { width: 80px; text-align: right; }
    .qty-input.overridden { border-color: #3b82f6; background: #eff6ff; }
    .search-panel { margin-top: 8px; padding: 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; }
    .search-panel input[type=text] { width: 100%; margin-bottom: 6px; }
    .search-results { max-height: 200px; overflow-y: auto; }
    .search-result-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .search-result-row:hover { background: #e5e7eb; }
    .search-spinner { color: #6b7280; font-size: 12px; padding: 4px; }
    .deleted-label { display: inline-block; padding: 2px 8px; background: #f3f4f6; color: #6b7280; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px; }
    /* Expandable row */
    .card-summary { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .card-summary:hover { background: #f9fafb; margin: -4px -6px; padding: 4px 6px; border-radius: 6px; }
    .card-chevron { font-size: 11px; color: #9ca3af; transition: transform 0.15s; min-width: 16px; text-align: center; }
    .card-chevron.open { transform: rotate(90deg); }
    .card-summary .sum-desc { flex: 1; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-summary .sum-match { font-size: 12px; color: #374151; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-summary .sum-price { font-size: 12px; min-width: 80px; text-align: right; }
    .card-summary .sum-savings { font-size: 12px; min-width: 90px; text-align: right; }
    .card-summary .sum-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .card-detail { padding-top: 10px; border-top: 1px solid #f3f4f6; margin-top: 10px; }
    .card-detail.hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <a href="/v2/">&larr; Tilbake til V2</a>
      <h2>Review: <code id="jobIdDisplay"></code></h2>
    </div>
    <div class="summary" id="summary"></div>
  </div>

  <div id="lockBar" class="lock-bar" style="display:none;">
    <span>Jobben er last. Endringer er deaktivert.</span>
    <button class="sm secondary" onclick="toggleLock()">Las opp</button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Sok i beskrivelse / art.nr..." oninput="applyFilters()"/>
    <select id="statusFilter" onchange="applyFilters()">
      <option value="">Alle statuser</option>
      <option value="pending">Pending</option>
      <option value="approved">Godkjent</option>
      <option value="rejected">Avvist</option>
      <option value="deleted">Slettet</option>
    </select>
    <select id="matchFilter" onchange="applyFilters()">
      <option value="">Alle match</option>
      <option value="matched">Har treff</option>
      <option value="no_match">Uten treff</option>
    </select>
    <select id="warnFilter" onchange="applyFilters()">
      <option value="">Alle</option>
      <option value="warn">Kun med varsel</option>
    </select>
    <span class="muted" id="filterCount"></span>
    <span style="flex:1;"></span>
    <button class="sm success" id="btnBulkApprove" onclick="bulkDecide('approved')">Godkjenn filtrerte</button>
    <button class="sm danger" id="btnBulkReject" onclick="bulkDecide('rejected')">Avvis filtrerte</button>
    <button class="sm secondary" id="btnBatchSelect" onclick="batchSelect()">Auto-velg beste</button>
    <span id="exportOptions" style="display:none;">
      <label style="font-size:11px;"><input type="checkbox" id="showLinePrices" checked> Vis linjepriser</label>
      <button class="sm" onclick="doExport('xlsx')">Excel</button>
      <button class="sm secondary" onclick="doExport('pdf')">PDF</button>
    </span>
    <button class="sm" id="btnCommitDb" onclick="commitToDb()" style="display:none;">Lagre til prisdatabase</button>
    <button class="sm secondary" id="lockBtn" onclick="toggleLock()">Las</button>
    <button class="sm" id="btnAddRow" onclick="toggleAddRowForm()">+ Legg til linje</button>
  </div>

  <div id="addRowForm" style="display:none; margin-bottom:12px; padding:12px 14px; background:white; border:1px solid #e5e7eb; border-radius:8px;">
    <div style="font-weight:600; margin-bottom:8px;">Legg til manuell linje</div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
      <label style="font-size:12px;">Beskrivelse *<br><input type="text" id="addDesc" style="width:100%;" placeholder="Produktbeskrivelse"></label>
      <label style="font-size:12px;">Pris (konkurrent) *<br><input type="number" id="addPrice" style="width:100%;" step="any" min="0" placeholder="0.00"></label>
      <label style="font-size:12px;">Antall<br><input type="number" id="addQty" style="width:100%;" step="any" min="0" value="1"></label>
      <label style="font-size:12px;">Konkurrent navn<br><input type="text" id="addCompName" style="width:100%;" placeholder="Valgfri"></label>
      <label style="font-size:12px;">Art.nr<br><input type="text" id="addArtnr" style="width:100%;" placeholder="Valgfri"></label>
      <label style="font-size:12px;">Spesifikasjon<br><input type="text" id="addSpec" style="width:100%;" placeholder="Valgfri"></label>
    </div>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button class="sm success" onclick="submitAddRow()">Legg til</button>
      <button class="sm secondary" onclick="toggleAddRowForm()">Avbryt</button>
      <span class="muted" id="addRowMsg"></span>
    </div>
  </div>

  <div id="rows"></div>

  <div class="pager" id="pager"></div>

<script>
const JOB_ID = location.pathname.split('/review/')[1]?.split('/')[0] || '';
let allRows = [];
let filteredRows = [];
let locked = false;
const PAGE_SIZE = 25;
let currentPage = 0;
let debounceTimers = {};
let openSearchPanels = {};
let searchControllers = {};  // AbortController per search panel
let expandedRows = {};

async function loadReview() {
  const resp = await fetch('/v2/review/' + JOB_ID);
  if (!resp.ok) {
    document.getElementById('rows').innerHTML = '<p class="muted">Kunne ikke laste review-data.</p>';
    return;
  }
  const data = await resp.json();
  allRows = data.rows || [];
  locked = data.lock?.locked || false;

  document.getElementById('jobIdDisplay').textContent = JOB_ID.substring(0, 12) + '...';
  document.getElementById('exportOptions').style.display = 'inline-flex';
  document.getElementById('exportOptions').style.gap = '6px';
  document.getElementById('exportOptions').style.alignItems = 'center';
  document.getElementById('btnCommitDb').style.display = 'inline';
  updateSummary(data.summary);
  updateLockUI();
  applyFilters();
}

function updateSummary(s) {
  if (!s) return;
  let html = '<span class="badge badge-approved">' + s.approved + ' godkjent</span>' +
    '<span class="badge badge-rejected">' + s.rejected + ' avvist</span>' +
    '<span class="badge badge-pending">' + s.pending + ' pending</span>';
  if (s.deleted > 0) {
    html += '<span class="badge badge-deleted">' + s.deleted + ' slettet</span>';
  }
  html += '<span class="muted">' + allRows.length + ' rader totalt</span>';
  document.getElementById('summary').innerHTML = html;
}

function updateLockUI() {
  document.getElementById('lockBar').style.display = locked ? 'flex' : 'none';
  document.getElementById('lockBtn').textContent = locked ? 'Las opp' : 'Las';
  document.getElementById('btnBulkApprove').disabled = locked;
  document.getElementById('btnBulkReject').disabled = locked;
  document.getElementById('btnBatchSelect').disabled = locked;
  document.getElementById('btnAddRow').disabled = locked;
  if (locked) document.getElementById('addRowForm').style.display = 'none';
}

function applyFilters(preservePage) {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const matchF = document.getElementById('matchFilter').value;
  const warnF = document.getElementById('warnFilter').value;

  filteredRows = allRows.filter(r => {
    // Handle deleted filter
    if (statusF === 'deleted') {
      if (!r.deleted) return false;
    } else if (statusF) {
      if (r.deleted) return false;
      if (r.review_status !== statusF) return false;
    } else {
      // Default: hide deleted rows unless specifically filtered
      if (r.deleted) return false;
    }
    if (matchF === 'matched' && r.match_status !== 'matched') return false;
    if (matchF === 'no_match' && r.match_status !== 'no_match') return false;
    if (warnF === 'warn' && !r.merge_warning) return false;
    if (search) {
      const hay = ((r.description || '') + ' ' + (r.competitor_artnr || '') + ' ' + (r.competitor || '')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const activeCount = allRows.filter(r => !r.deleted).length;
  document.getElementById('filterCount').textContent = filteredRows.length + ' av ' + activeCount + ' aktive rader';

  if (!preservePage) currentPage = 0;
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
  if (currentPage >= totalPages) currentPage = totalPages - 1;

  renderPage();
}

function renderPage() {
  const start = currentPage * PAGE_SIZE;
  const page = filteredRows.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('rows');

  if (page.length === 0) {
    container.innerHTML = '<p class="muted">Ingen rader matcher filteret.</p>';
    document.getElementById('pager').innerHTML = '';
    return;
  }

  container.innerHTML = page.map(r => renderCard(r)).join('');
  renderPager();
}

function renderCard(r) {
  const idx = r.dedup_idx;
  const isDeleted = r.deleted;
  const st = r.review_status || 'pending';
  const warnCls = r.merge_warning ? ' warn' : '';
  const deletedCls = isDeleted ? ' deleted-card' : '';
  const selIdx = r.selected_candidate_idx;
  const cands = r.candidates || [];
  const dis = (locked || isDeleted) ? 'disabled' : '';
  const isOpen = !!expandedRows[idx];

  let html = '<div class="card ' + (isDeleted ? '' : st) + warnCls + deletedCls + '" id="card-' + idx + '">';

  // --- Clickable summary row ---
  const selCand = (selIdx != null && cands[selIdx]) ? cands[selIdx] : null;
  const matchLabel = selCand ? productLink(selCand.our_gid, selCand.our_artnr) + ' ' + esc(selCand.our_description || '') : (cands.length ? cands.length + ' kandidater' : 'Ingen match');
  const statusBadge = {approved:'badge-approved', rejected:'badge-rejected', pending:'badge-pending'}[st] || 'badge-pending';
  const statusText = {approved:'Godkjent', rejected:'Avvist', pending:'Pending'}[st] || st;

  html += '<div class="card-summary" onclick="toggleExpand(' + idx + ')">';
  html += '<span class="card-chevron' + (isOpen ? ' open' : '') + '" id="chevron-' + idx + '">&#9654;</span>';
  html += '<span class="sum-desc">' + esc(r.description || '(ingen beskrivelse)');
  if (isDeleted) html += ' <span class="deleted-label">SLETTET</span>';
  if (r.merged_from_count > 1) html += '<span class="merged-info">(' + r.merged_from_count + ' slatt sammen)</span>';
  html += '</span>';
  html += '<span class="sum-match muted">' + matchLabel + '</span>';
  html += '<span class="sum-price">' + money(r.our_unit_price) + '</span>';
  html += '<span class="sum-savings">' + savingsHtml(r.savings_amount) + '</span>';
  html += '<span class="sum-status ' + statusBadge + '">' + statusText + '</span>';
  html += '</div>';

  // --- Expandable detail ---
  html += '<div class="card-detail' + (isOpen ? '' : ' hidden') + '" id="detail-' + idx + '">';

  // Decision buttons
  html += '<div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:8px;">';
  if (isDeleted) {
    html += '<button class="sm warn-btn" onclick="restoreRow(' + idx + ')" ' + (locked ? 'disabled' : '') + '>Gjenopprett</button>';
  } else {
    html += '<button class="sm ' + (st === 'approved' ? 'success' : 'secondary') + '" onclick="decide(' + idx + ',\'approved\')" ' + dis + '>Godkjenn</button>';
    html += '<button class="sm ' + (st === 'rejected' ? 'danger' : 'secondary') + '" onclick="decide(' + idx + ',\'rejected\')" ' + dis + '>Avvis</button>';
    html += '<button class="sm ' + (st === 'pending' ? '' : 'secondary') + '" onclick="decide(' + idx + ',\'pending\')" ' + dis + '>Pending</button>';
    html += '<button class="sm danger" onclick="deleteRow(' + idx + ')" ' + dis + ' title="Slett rad">Slett</button>';
  }
  html += '</div>';

  if (isDeleted) {
    html += '</div></div>';
    return html;
  }

  // Meta grid (input data)
  const effectiveUnits = r.quantity_override || r.total_units;
  const hasOverride = r.quantity_override != null;
  html += '<div class="card-grid">';
  html += '<div><dt>Konkurrent</dt><dd>' + esc(r.competitor || '') + '</dd></div>';
  html += '<div><dt>Konk. art.nr</dt><dd>' + esc(r.competitor_artnr || '') + '</dd></div>';
  html += '<div><dt>Kvt.</dt><dd>' + fmt(r.quantity_purchased) + '</dd></div>';
  html += '<div><dt>Pakning</dt><dd>' + esc(r.packaging_text || '-') + ' (' + (r.packaging_count || 1) + ')</dd></div>';
  html += '<div><dt>Totalt enheter</dt><dd>';
  html += '<input type="number" class="qty-input' + (hasOverride ? ' overridden' : '') + '" value="' + (effectiveUnits != null ? effectiveUnits : '') + '" '
    + 'onchange="updateQuantity(' + idx + ', this.value)" '
    + 'title="' + (hasOverride ? 'Overstyrt (original: ' + fmt(r.total_units) + ')' : 'Rediger for a overstyre') + '" '
    + (locked ? 'disabled' : '') + ' min="0" step="any"/>';
  html += '</dd></div>';
  html += '<div><dt>Konk. linjebelop</dt><dd>' + money(r.competitor_line_amount) + '</dd></div>';
  html += '<div><dt>Var pris/enhet</dt><dd>' + money(r.our_unit_price) + '</dd></div>';
  html += '<div><dt>Vart linjebelop</dt><dd>' + money(r.our_comparable_line_price) + '</dd></div>';
  html += '<div><dt>Besparelse</dt><dd>' + savingsHtml(r.savings_amount) + '</dd></div>';
  html += '</div>';

  // Merge warning
  if (r.merge_warning && r.inconsistent_fields?.length) {
    html += '<div class="warn-box">Avvik i sammenslatte rader: ' +
      r.inconsistent_fields.map(f => esc(f.field) + ' (' + f.values.map(v => esc(String(v))).join(' vs ') + ')').join(', ') +
      '</div>';
  }

  // Candidates
  if (cands.length > 0) {
    html += '<div class="candidates">';
    html += '<div class="muted" style="margin-bottom:4px; display:flex; gap:8px; font-size:11px; padding:0 8px;">';
    html += '<span style="min-width:70px;">Art.Nr</span><span style="min-width:16px;"></span><span style="flex:1;">Navn</span><span style="flex:0.6;">Spesifikasjon</span><span style="min-width:90px;text-align:right;">Pris</span><span style="min-width:60px;text-align:right;">Score</span>';
    html += '</div>';
    for (const c of cands) {
      const isSel = c.candidate_idx === selIdx;
      const candCls = 'cand-row' + (isSel ? ' selected' : '') + (locked ? ' disabled' : '');
      html += '<div class="' + candCls + '" onclick="selectCandidate(' + idx + ',' + c.candidate_idx + ')">';
      html += renderProductCols(c);
      html += '</div>';
    }
    if (!locked) {
      html += '<button class="sm secondary" style="margin-top:4px;" onclick="toggleSearchPanel(' + idx + ')">Sok alternativt produkt...</button>';
    }
    html += '</div>';
  } else {
    html += '<div class="no-match">Ingen kandidater funnet';
    if (!locked) {
      html += ' &mdash; <button class="sm secondary" onclick="toggleSearchPanel(' + idx + ')">Sok i katalog</button>';
    }
    html += '</div>';
  }

  // Search panel (inline, hidden by default)
  html += '<div class="search-panel" id="search-panel-' + idx + '" style="display:' + (openSearchPanels[idx] ? 'block' : 'none') + ';">';
  html += '<input type="text" placeholder="Sok etter produktnavn, art.nr..." oninput="debounceSearch(' + idx + ', this.value)" id="search-input-' + idx + '"/>';
  html += '<div class="search-results" id="search-results-' + idx + '"></div>';
  html += '</div>';

  // Extras
  html += '<div class="extras">';
  html += '<textarea placeholder="Kommentar..." onchange="saveExtra(' + idx + ',this.value)" oninput="debounceExtra(\'comment\',' + idx + ',this.value)"' + (locked ? ' disabled' : '') + '>' + esc(r.comment || '') + '</textarea>';
  html += '</div>';

  html += '</div>'; // close detail
  html += '</div>'; // close card
  return html;
}

function renderPager() {
  const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
  if (totalPages <= 1) { document.getElementById('pager').innerHTML = ''; return; }
  let html = '';
  html += '<button class="sm secondary" onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage === 0 ? 'disabled' : '') + '>&laquo; Forrige</button>';
  html += '<span class="muted">Side ' + (currentPage + 1) + ' av ' + totalPages + '</span>';
  html += '<button class="sm secondary" onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages - 1 ? 'disabled' : '') + '>Neste &raquo;</button>';
  document.getElementById('pager').innerHTML = html;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
  if (p < 0 || p >= totalPages) return;
  currentPage = p;
  renderPage();
  window.scrollTo(0, 0);
}

function toggleExpand(idx, evt) {
  if (evt) evt.stopPropagation();
  expandedRows[idx] = !expandedRows[idx];
  const chevron = document.getElementById('chevron-' + idx);
  const detail = document.getElementById('detail-' + idx);
  if (chevron) chevron.classList.toggle('open', expandedRows[idx]);
  if (detail) detail.classList.toggle('hidden', !expandedRows[idx]);
}

// --- API calls ---

async function selectCandidate(dedupIdx, candidateIdx) {
  if (locked) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/select', { dedup_idx: dedupIdx, candidate_idx: candidateIdx });
  if (!resp.ok) return;
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row) {
    row.selected_candidate_idx = candidateIdx;
    const cand = (row.candidates || [])[candidateIdx];
    if (cand) {
      row.our_unit_price = cand.our_unit_price;
      recalcLocal(row);
    }
  }
  applyFilters(true);
}

async function decide(dedupIdx, status) {
  if (locked) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/decide', { dedup_idx: dedupIdx, status: status });
  if (!resp.ok) return;
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row) row.review_status = status;
  updateSummaryFromRows();
  applyFilters(true);
}

async function bulkDecide(status) {
  if (locked) return;
  const indices = filteredRows.filter(r => !r.deleted).map(r => r.dedup_idx);
  if (!indices.length) return;
  if (!confirm('Sett ' + indices.length + ' rader til "' + status + '"?')) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/bulk-decide', { dedup_indices: indices, status: status });
  if (!resp.ok) return;
  for (const r of allRows) {
    if (indices.includes(r.dedup_idx)) r.review_status = status;
  }
  updateSummaryFromRows();
  applyFilters(true);
}

async function batchSelect() {
  if (locked) return;
  await postJson('/v2/review/' + JOB_ID + '/batch-select', { override_existing: false });
  await loadReview();
}

async function deleteRow(dedupIdx) {
  if (locked) return;
  if (!confirm('Slett denne raden? Den kan gjenopprettes senere.')) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/delete', { dedup_idx: dedupIdx });
  if (!resp.ok) return;
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row) row.deleted = true;
  updateSummaryFromRows();
  applyFilters(true);
}

async function restoreRow(dedupIdx) {
  if (locked) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/restore', { dedup_idx: dedupIdx });
  if (!resp.ok) return;
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row) row.deleted = false;
  updateSummaryFromRows();
  applyFilters(true);
}

async function updateQuantity(dedupIdx, value) {
  if (locked) return;
  const qty = value === '' ? null : parseFloat(value);
  if (qty !== null && (isNaN(qty) || qty < 0)) return;
  const body = { dedup_idx: dedupIdx, quantity_override: qty };
  const resp = await postJson('/v2/review/' + JOB_ID + '/extras', body);
  if (!resp.ok) return;
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row) {
    row.quantity_override = qty;
    recalcLocal(row);
  }
  applyFilters(true);
}

function recalcLocal(row) {
  const units = row.quantity_override || row.total_units || 0;
  const price = row.our_unit_price;
  const compLine = row.competitor_line_amount;
  if (price != null && units > 0) {
    row.our_comparable_line_price = Math.round(units * price * 100) / 100;
    row.savings_amount = compLine != null ? Math.round((compLine - row.our_comparable_line_price) * 100) / 100 : null;
  } else {
    row.our_comparable_line_price = null;
    row.savings_amount = null;
  }
}

// --- Catalog search ---

function toggleSearchPanel(dedupIdx) {
  const panel = document.getElementById('search-panel-' + dedupIdx);
  if (!panel) return;
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  openSearchPanels[dedupIdx] = !isOpen;
  if (!isOpen) {
    const input = document.getElementById('search-input-' + dedupIdx);
    if (input) input.focus();
  } else {
    // Abort any in-flight search when closing panel
    if (searchControllers[dedupIdx]) {
      searchControllers[dedupIdx].abort();
      delete searchControllers[dedupIdx];
    }
  }
}

function debounceSearch(dedupIdx, query) {
  const key = 'search-' + dedupIdx;
  if (debounceTimers[key]) clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(() => searchCatalog(dedupIdx, query), 300);
}

async function searchCatalog(dedupIdx, query) {
  const container = document.getElementById('search-results-' + dedupIdx);
  if (!container) return;
  if (!query || query.length < 2) {
    container.innerHTML = '<div class="muted">Skriv minst 2 tegn for a soke...</div>';
    return;
  }
  // Abort any in-flight request for this panel
  if (searchControllers[dedupIdx]) {
    searchControllers[dedupIdx].abort();
  }
  const controller = new AbortController();
  searchControllers[dedupIdx] = controller;

  container.innerHTML = '<div class="search-spinner">Soker...</div>';
  try {
    const resp = await fetch('/v2/review/' + JOB_ID + '/search-catalog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, limit: 15 }),
      signal: controller.signal,
    });
    const data = await resp.json();
    // If this controller was replaced by a newer request, discard
    if (searchControllers[dedupIdx] !== controller) return;
    if (!resp.ok) {
      container.innerHTML = '<div class="muted">Sok feilet.</div>';
      return;
    }
    const results = data.results || [];
    if (results.length === 0) {
      container.innerHTML = '<div class="muted">Ingen treff.</div>';
      return;
    }
    container.innerHTML = results.map(r =>
      '<div class="cand-row" onclick="selectSearchResult(' + dedupIdx + ', \'' + escAttr(r.our_artnr) + '\')">' +
      renderProductCols(r) +
      '</div>'
    ).join('');
  } catch (e) {
    if (e.name === 'AbortError') return;  // superseded by newer search
    container.innerHTML = '<div class="muted">Sok feilet.</div>';
  }
}

async function selectSearchResult(dedupIdx, artnr) {
  if (locked) return;
  const resp = await postJson('/v2/review/' + JOB_ID + '/replace-candidate', { dedup_idx: dedupIdx, our_artnr: artnr });
  if (!resp.ok) {
    alert('Kunne ikke velge produkt: ' + (resp.error || 'ukjent feil'));
    return;
  }
  // Reload this row's data from the response
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row && resp.row) {
    row.candidates = resp.row.candidates;
    row.selected_candidate_idx = resp.row.selected_candidate_idx;
    row.our_unit_price = resp.row.our_unit_price;
    row.our_comparable_line_price = resp.row.our_comparable_line_price;
    row.savings_amount = resp.row.savings_amount;
    row.match_status = 'matched';
  }
  openSearchPanels[dedupIdx] = false;
  applyFilters(true);
}

// --- Comment ---

function debounceExtra(field, dedupIdx, value) {
  const key = field + '-' + dedupIdx;
  if (debounceTimers[key]) clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(() => {
    saveExtra(dedupIdx, value);
  }, 800);
}

async function saveExtra(dedupIdx, comment) {
  if (locked) return;
  const body = { dedup_idx: dedupIdx };
  if (comment !== null && comment !== undefined) body.comment = comment;
  await postJson('/v2/review/' + JOB_ID + '/extras', body);
  const row = allRows.find(r => r.dedup_idx === dedupIdx);
  if (row && comment !== null && comment !== undefined) {
    row.comment = comment;
  }
}

// --- Lock ---

async function toggleLock() {
  if (locked) {
    await postJson('/v2/review/' + JOB_ID + '/unlock', {});
    locked = false;
  } else {
    if (!confirm('Las jobben? Endringer deaktiveres.')) return;
    await postJson('/v2/review/' + JOB_ID + '/lock', {});
    locked = true;
  }
  updateLockUI();
  applyFilters(true);
}

function updateSummaryFromRows() {
  const s = { approved: 0, rejected: 0, pending: 0, deleted: 0 };
  for (const r of allRows) {
    if (r.deleted) { s.deleted++; continue; }
    s[r.review_status || 'pending']++;
  }
  updateSummary(s);
}

async function postJson(url, body) {
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    data.ok = resp.ok;
    return data;
  } catch (e) {
    console.error('API error:', e);
    return { ok: false };
  }
}

// --- Formatting ---

function renderProductCols(p) {
  // Shared column rendering: Art.Nr | Link | Navn | Spesifikasjon | Pris | Score
  let h = artnrWithLink(p.our_artnr, p.our_gid);
  if (p.our_gid) {
    h += '<span class="link-icon"><a href="https://www.onemed.no/nb-no/products/' + encodeURIComponent(p.our_gid) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Se produkt">&#x2197;</a></span>';
  } else {
    h += '<span class="link-icon"></span>';
  }
  h += '<span class="name">' + esc(p.our_description || '') + '</span>';
  h += '<span class="spec">' + esc(p.our_specification || '') + '</span>';
  h += '<span class="price">' + money(p.our_unit_price) + '</span>';
  h += '<span class="score">' + esc(p.match_quality || '') + '</span>';
  return h;
}
function productLink(gid, label) {
  if (!gid) return esc(label || '');
  return '<a href="https://www.onemed.no/nb-no/products/' + encodeURIComponent(gid) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Se produkt hos OneMed">' + esc(label || gid) + '</a>';
}
function artnrWithLink(artnr, gid) {
  if (!gid) return '<span class="artnr">' + esc(artnr || '') + '</span>';
  return '<span class="artnr"><a href="https://www.onemed.no/nb-no/products/' + encodeURIComponent(gid) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Se produkt">' + esc(artnr || '') + '</a></span>';
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }
function fmt(v) { return v != null ? String(v) : '-'; }
function money(v) {
  if (v == null) return '<span class="muted">-</span>';
  const n = Number(v);
  if (isNaN(n)) return '<span class="muted">-</span>';
  return n.toLocaleString('nb-NO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kr';
}
function savingsHtml(v) {
  if (v == null) return '<span class="muted">-</span>';
  const n = Number(v);
  if (isNaN(n)) return '<span class="muted">-</span>';
  const formatted = Math.abs(n).toLocaleString('nb-NO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kr';
  if (n > 0) return '<span class="savings-pos">+' + formatted + '</span>';
  if (n < 0) return '<span class="savings-neg">-' + formatted + '</span>';
  return formatted;
}

function doExport(format) {
  const showPrices = document.getElementById('showLinePrices').checked;
  const url = '/v2/export/' + JOB_ID + '?format=' + format + '&show_line_prices=' + showPrices;
  window.open(url, '_blank');
}

async function commitToDb() {
  const approved = allRows.filter(r => r.review_status === 'approved' && !r.deleted).length;
  if (approved === 0) {
    alert('Ingen godkjente rader. Godkjenn rader for du lagrer til prisdatabasen.');
    return;
  }
  if (!confirm('Lagre ' + approved + ' godkjente rader til prisdatabasen?')) return;
  const resp = await postJson('/v2/pricedb/commit/' + JOB_ID, {});
  if (resp.ok) {
    alert('Lagret ' + (resp.committed || 0) + ' rader til prisdatabasen.');
  } else {
    alert('Feil: ' + (resp.error || 'ukjent'));
  }
}

// --- Add row ---

function toggleAddRowForm() {
  const form = document.getElementById('addRowForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  document.getElementById('addRowMsg').textContent = '';
}

async function submitAddRow() {
  const desc = document.getElementById('addDesc').value.trim();
  const price = document.getElementById('addPrice').value;
  const msg = document.getElementById('addRowMsg');
  if (!desc) { msg.textContent = 'Beskrivelse er påkrevd.'; return; }
  if (!price) { msg.textContent = 'Pris er påkrevd.'; return; }

  msg.textContent = 'Legger til...';
  const body = {
    description: desc,
    price: parseFloat(price),
    quantity: parseFloat(document.getElementById('addQty').value) || 1,
    competitor_name: document.getElementById('addCompName').value.trim(),
    competitor_artnr: document.getElementById('addArtnr').value.trim(),
    specification: document.getElementById('addSpec').value.trim(),
  };
  const resp = await postJson('/v2/review/' + JOB_ID + '/add-row', body);
  if (!resp.ok) {
    msg.textContent = 'Feil: ' + (resp.error || 'ukjent');
    return;
  }
  // Append and show
  if (resp.row) {
    allRows.push(resp.row);
    expandedRows[resp.row.dedup_idx] = true;
  }
  // Clear form
  document.getElementById('addDesc').value = '';
  document.getElementById('addPrice').value = '';
  document.getElementById('addQty').value = '1';
  document.getElementById('addCompName').value = '';
  document.getElementById('addArtnr').value = '';
  document.getElementById('addSpec').value = '';
  document.getElementById('addRowForm').style.display = 'none';
  msg.textContent = '';
  updateSummaryFromRows();
  applyFilters();
  // Navigate to last page so the new row is visible
  const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
  if (totalPages > 1) {
    currentPage = totalPages - 1;
    renderPage();
  }
}

// --- Init ---
loadReview();
